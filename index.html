<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكارك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-deep:#F4EDDD;
    --ink:#241F1A;
    --ink-soft:#5A5248;
    --teal:#16413C;
    --teal-deep:#0E2E2A;
    --teal-tint:#E3ECE7;
    --brass:#B8863B;
    --brass-soft:#D9BD8C;
    --line:#D9CFB8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--paper); color:var(--ink); font-family:'Tajawal',sans-serif; overflow-x:hidden;}
  body{ -webkit-font-smoothing:antialiased; }

  ::selection{ background:var(--brass-soft); }

  a{ color:inherit; text-decoration:none; }

  .app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- ornamental pattern ---------- */
  .band{
    height:14px;
    background-image: linear-gradient(135deg, var(--teal) 25%, transparent 25%),
                       linear-gradient(225deg, var(--teal) 25%, transparent 25%),
                       linear-gradient(45deg, var(--teal) 25%, transparent 25%),
                       linear-gradient(315deg, var(--teal) 25%, transparent 25%);
    background-position: 9px 0, 9px 0, 0 0, 0 0;
    background-size: 18px 18px;
    background-repeat: repeat-x;
    opacity:.85;
  }

  /* ---------- header ---------- */
  header.top{
    padding: 34px 24px 26px;
    text-align:center;
    position:relative;
  }
  .brand{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size: clamp(2.1rem, 6vw, 2.8rem);
    color: var(--teal-deep);
    letter-spacing: .5px;
  }
  .brand span{ color: var(--brass); }
  .tagline{
    margin-top:10px;
    color: var(--ink-soft);
    font-size: .98rem;
    font-weight:400;
  }
  .hero-verse{
    max-width: 620px;
    margin: 26px auto 4px;
    font-family:'Amiri', serif;
    font-size: clamp(1.25rem, 3.4vw, 1.6rem);
    line-height: 2.1;
    color: var(--ink);
    font-style: italic;
  }
  .hero-verse .src{
    display:block;
    margin-top: 10px;
    font-family:'Tajawal', sans-serif;
    font-style:normal;
    font-size: .82rem;
    color: var(--ink-soft);
  }

  /* ---------- home: category list ---------- */
  main{ flex:1; width:100%; }
  .home{
    max-width: 720px;
    margin: 10px auto 60px;
    padding: 0 20px;
  }
  .section-label{
    font-size: .82rem;
    color: var(--ink-soft);
    margin: 34px 4px 14px;
    padding-right: 14px;
    border-right: 3px solid var(--brass);
  }
  .cat-list{ display:flex; flex-direction:column; gap:2px; }
  .cat{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    padding: 20px 18px;
    background: transparent;
    border-bottom: 1px solid var(--line);
    cursor:pointer;
    transition: background .25s ease, padding-right .25s ease;
  }
  .cat:first-child{ border-top: 1px solid var(--line); }
  .cat:hover{ background: var(--teal-tint); padding-right: 24px; }
  .cat .name{
    font-family:'Amiri', serif;
    font-size: 1.32rem;
    font-weight: 700;
    color: var(--teal-deep);
  }
  .cat .meta{
    font-size: .82rem;
    color: var(--ink-soft);
    margin-top: 4px;
    display:block;
    font-family:'Tajawal', sans-serif;
    font-weight: 400;
  }
  .cat .arrow{
    font-size: 1.3rem;
    color: var(--brass);
    flex-shrink:0;
  }
  .cat .progress-dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--line);
    margin-inline-start: 10px;
    flex-shrink:0;
  }
  .cat.done .progress-dot{ background: var(--brass); }

  /* free tasbih tile */
  .tasbih-tile{
    margin-top: 30px;
    padding: 26px 22px;
    border: 1px solid var(--line);
    background: var(--teal-tint);
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    cursor:pointer;
  }
  .tasbih-tile .name{ font-family:'Amiri',serif; font-size:1.25rem; font-weight:700; color:var(--teal-deep); }
  .tasbih-tile .meta{ font-size:.82rem; color:var(--ink-soft); margin-top:4px; }
  .tasbih-tile .count-badge{
    font-family:'Tajawal',sans-serif; font-weight:900; font-size:1.4rem;
    color: var(--brass); min-width: 46px; text-align:center;
  }

  /* ---------- reading view ---------- */
  .reader{ display:none; max-width: 680px; margin: 0 auto 70px; padding: 0 20px; }
  .reader.active{ display:block; }
  .home.hidden{ display:none; }

  .reader-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 4px 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .back-btn{
    display:flex; align-items:center; gap:8px;
    font-size:.92rem; color: var(--teal);
    background:none; border:none; cursor:pointer; font-family:'Tajawal',sans-serif; font-weight:500;
    padding: 8px 4px;
  }
  .reader-title{
    font-family:'Amiri',serif; font-weight:700; font-size:1.5rem; color:var(--teal-deep);
  }
  .reader-progress{
    font-size:.82rem; color: var(--ink-soft);
  }

  .dhikr-card{
    padding: 26px 22px;
    border-bottom: 1px solid var(--line);
    transition: opacity .3s ease;
  }
  .dhikr-card.finished{ opacity:.42; }
  .dhikr-text{
    font-family:'Amiri', serif;
    font-size: clamp(1.2rem, 3.6vw, 1.5rem);
    line-height: 2.15;
    color: var(--ink);
    text-align: right;
  }
  .dhikr-footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top: 18px;
  }
  .dhikr-note{
    font-size: .82rem;
    color: var(--ink-soft);
    max-width: 70%;
  }
  .counter{
    display:flex; align-items:center; gap:14px;
  }
  .counter .remaining{
    font-family:'Tajawal',sans-serif; font-weight:900; font-size:1.15rem;
    color: var(--teal-deep);
    min-width: 30px; text-align:center;
  }
  .tap-btn{
    width: 52px; height:52px; border-radius:50%;
    background: var(--teal);
    color: var(--paper);
    border:none; cursor:pointer;
    font-family:'Amiri',serif; font-size:1rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease, background .2s ease;
    box-shadow: 0 0 0 1px var(--teal-deep) inset;
  }
  .tap-btn:active{ transform: scale(.9); }
  .dhikr-card.finished .tap-btn{ background: var(--brass); }

  .reader-done{
    text-align:center;
    padding: 40px 20px;
    display:none;
  }
  .reader-done.show{ display:block; }
  .reader-done .mark{ font-family:'Amiri',serif; font-size:1.6rem; color: var(--teal-deep); margin-bottom: 8px;}
  .reader-done .sub{ color: var(--ink-soft); font-size:.9rem; margin-bottom: 22px; }
  .reader-done button{
    background: var(--teal); color: var(--paper); border:none;
    padding: 12px 26px; font-family:'Tajawal',sans-serif; font-weight:700; font-size:.95rem;
    cursor:pointer;
  }

  /* free tasbih reader */
  .free-tasbih{ display:none; text-align:center; padding: 40px 20px 20px; }
  .free-tasbih.active{ display:block; }
  .free-tasbih .phrase{
    font-family:'Amiri',serif; font-size: clamp(1.6rem, 6vw, 2.1rem); color: var(--teal-deep); margin-bottom: 30px;
  }
  .free-tasbih .big-count{
    font-size: clamp(3.4rem, 16vw, 5rem);
    font-weight:900; color: var(--brass);
    line-height:1;
  }
  .free-tasbih .tap-area{
    margin: 34px auto 18px;
    width: 180px; height:180px; border-radius:50%;
    background: var(--teal);
    color: var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:1.1rem;
    cursor:pointer; user-select:none;
    box-shadow: 0 0 0 8px var(--teal-tint);
    transition: transform .1s ease;
  }
  .free-tasbih .tap-area:active{ transform: scale(.94); }
  .free-tasbih .reset{
    background:none; border:1px solid var(--line); color: var(--ink-soft);
    padding: 9px 20px; font-family:'Tajawal',sans-serif; cursor:pointer; margin-top: 10px;
  }
  .phrase-switch{
    display:flex; gap:8px; justify-content:center; margin-top: 26px; flex-wrap:wrap;
  }
  .phrase-switch button{
    background: none; border:1px solid var(--line); color: var(--ink-soft);
    padding: 7px 14px; font-size:.82rem; font-family:'Tajawal',sans-serif; cursor:pointer;
  }
  .phrase-switch button.active{ background: var(--teal); color:var(--paper); border-color: var(--teal); }

  footer{
    text-align:center; padding: 26px 20px 40px;
    color: var(--ink-soft); font-size:.8rem;
  }

  @media (max-width: 480px){
    .cat{ padding: 17px 14px; }
    .dhikr-card{ padding: 22px 14px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="band"></div>
  <header class="top">
    <div class="brand">أذكار<span>ك</span></div>
    <div class="tagline">رفيقك في ذِكر الله على مدار يومك</div>
    <p class="hero-verse">
      أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ
      <span class="src">سورة الرعد — ٢٨</span>
    </p>
  </header>

  <main>
    <div class="home" id="home">
      <div class="section-label">اختر وردك</div>
      <div class="cat-list" id="catList"></div>

      <div class="tasbih-tile" id="freeTasbihTile">
        <div>
          <div class="name">تسبيح حر</div>
          <div class="meta">عدّاد مفتوح لأي ذكر تختاره</div>
        </div>
        <div class="count-badge" id="freeTasbihBadge">0</div>
      </div>
    </div>

    <div class="reader" id="reader">
      <div class="reader-head">
        <button class="back-btn" id="backBtn">← رجوع</button>
        <div class="reader-title" id="readerTitle"></div>
        <div class="reader-progress" id="readerProgress"></div>
      </div>
      <div id="cardHost"></div>
      <div class="reader-done" id="readerDone">
        <div class="mark">تقبّل الله منك</div>
        <div class="sub">أتممت هذا الورد كاملًا</div>
        <button id="restartBtn">إعادة الورد</button>
      </div>
    </div>

    <div class="free-tasbih" id="freeTasbih">
      <div class="phrase" id="ftPhrase">سُبْحَانَ اللَّهِ</div>
      <div class="big-count" id="ftCount">0</div>
      <div class="tap-area" id="ftTap">اضغط للتسبيح</div>
      <button class="reset" id="ftReset">إعادة العداد</button>
      <div class="phrase-switch" id="ftSwitch"></div>
      <div style="margin-top:26px;">
        <button class="back-btn" id="ftBack">← رجوع للرئيسية</button>
      </div>
    </div>
  </main>

  <footer>جعله الله في ميزان حسناتك</footer>
  <div class="band"></div>
</div>

<script>
const DATA = {
  morning: {

      { text: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ", reps: 1 },
      { text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ: فَتْحَهُ وَنَصْرَهُ وَنُورَهُ وَبَرَكَتَهُ وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ", reps: 1 },

      { text: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", note: "سيّد الاستغفار — مرة واحدة", reps: 1 },

      { text: "حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", reps: 7 },

      { text: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ", note: "آية الكرسي", reps: 1 },
      { text: "سُبْحَانَ اللَّهِ", note: "تسبيح فاطمة عند النوم", reps: 33 },
      { text: "الْحَمْدُ لِلَّهِ", note: "تسبيح فاطمة عند النوم", reps: 33 },

const state = { free: {}, activePhrase: 'sub', progress: {} };
const FREE_PHRASES = [
  { key:'sub', label:'سبحان الله', text:'سُبْحَانَ اللَّهِ' },
  { key:'hamd', label:'الحمد لله', text:'الْحَمْدُ لِلَّهِ' },
  { key:'akbar', label:'الله أكبر', text:'اللَّهُ أَكْبَرُ' },
  { key:'lahawla', label:'لا إله إلا الله', text:'لَا إِلَٰهَ إِلَّا اللَّهُ' },
  { key:'istighfar', label:'أستغفر الله', text:'أَسْتَغْفِرُ اللَّهَ' }
];
FREE_PHRASES.forEach(p => state.free[p.key] = 0);

let currentCat = null;
let cardStates = [];

const catList = document.getElementById('catList');
const home = document.getElementById('home');
const reader = document.getElementById('reader');
const cardHost = document.getElementById('cardHost');
const readerTitle = document.getElementById('readerTitle');
const readerProgress = document.getElementById('readerProgress');
const readerDone = document.getElementById('readerDone');

function renderHome(){
  catList.innerHTML = '';
  Object.entries(DATA).forEach(([key, cat]) => {
    const totalReps = cat.items.reduce((s,i)=>s+i.reps,0);
    const el = document.createElement('div');
    el.className = 'cat' + (state.progress[key] ? ' done' : '');
    el.innerHTML = `
      <div>
        <div class="name">${cat.title}</div>
        <span class="meta">${cat.subtitle} · ${cat.items.length} أذكار</span>
      </div>
      <div style="display:flex; align-items:center;">
        <span class="progress-dot"></span>
        <span class="arrow">‹</span>
      </div>`;
    el.addEventListener('click', () => openCategory(key));
    catList.appendChild(el);
  });
}

function openCategory(key){
  currentCat = key;
  const cat = DATA[key];
  cardStates = cat.items.map(i => ({ remaining: i.reps }));
  readerTitle.textContent = cat.title;
  home.classList.add('hidden');
  document.getElementById('freeTasbih').classList.remove('active');
  reader.classList.add('active');
  readerDone.classList.remove('show');
  renderReader();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderReader(){
  const cat = DATA[currentCat];
  cardHost.innerHTML = '';
  let finishedCount = 0;
  cat.items.forEach((item, idx) => {
    const cs = cardStates[idx];
    if (cs.remaining <= 0) finishedCount++;
    const card = document.createElement('div');
    card.className = 'dhikr-card' + (cs.remaining <= 0 ? ' finished' : '');
    card.innerHTML = `
      <div class="dhikr-text">${item.text}</div>
      <div class="dhikr-footer">
        <div class="dhikr-note">${item.note ? item.note : (item.reps > 1 ? `يُقال ${item.reps} مرات` : 'مرة واحدة')}</div>
        <div class="counter">
          <span class="remaining">${cs.remaining}</span>
          <button class="tap-btn" data-idx="${idx}" aria-label="سبّح">﴾</button>
        </div>
      </div>`;
    cardHost.appendChild(card);
  });
  readerProgress.textContent = `${finishedCount} / ${cat.items.length}`;

  cardHost.querySelectorAll('.tap-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = parseInt(e.currentTarget.dataset.idx, 10);
      if (cardStates[idx].remaining > 0){
        cardStates[idx].remaining--;
        renderReader();
        checkComplete();
      }
    });
  });
}

function checkComplete(){
  const allDone = cardStates.every(cs => cs.remaining <= 0);
  if (allDone){
    state.progress[currentCat] = true;
    readerDone.classList.add('show');
  }
}

document.getElementById('backBtn').addEventListener('click', closeReader);
document.getElementById('restartBtn').addEventListener('click', () => openCategory(currentCat));

function closeReader(){
  reader.classList.remove('active');
  home.classList.remove('hidden');
  renderHome();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* free tasbih */
const freeTasbih = document.getElementById('freeTasbih');
const ftPhrase = document.getElementById('ftPhrase');
const ftCount = document.getElementById('ftCount');
const ftSwitch = document.getElementById('ftSwitch');
const freeTasbihBadge = document.getElementById('freeTasbihBadge');

function renderFtSwitch(){
  ftSwitch.innerHTML = '';
  FREE_PHRASES.forEach(p => {
    const b = document.createElement('button');
    b.textContent = p.label;
    b.className = state.activePhrase === p.key ? 'active' : '';
    b.addEventListener('click', () => { state.activePhrase = p.key; updateFt(); });
    ftSwitch.appendChild(b);
  });
}
function updateFt(){
  const p = FREE_PHRASES.find(p => p.key === state.activePhrase);
  ftPhrase.textContent = p.text;
  ftCount.textContent = state.free[p.key];
  renderFtSwitch();
  const total = Object.values(state.free).reduce((a,b)=>a+b,0);
  freeTasbihBadge.textContent = total;
}

document.getElementById('freeTasbihTile').addEventListener('click', () => {
  home.classList.add('hidden');
  reader.classList.remove('active');
  freeTasbih.classList.add('active');
  updateFt();
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('ftBack').addEventListener('click', () => {
  freeTasbih.classList.remove('active');
  home.classList.remove('hidden');
  renderHome();
});
document.getElementById('ftTap').addEventListener('click', () => {
  state.free[state.activePhrase]++;
  updateFt();
});
document.getElementById('ftReset').addEventListener('click', () => {
  state.free[state.activePhrase] = 0;
  updateFt();
});

renderHome();
</script>
